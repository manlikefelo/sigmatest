[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmatest"
version = "0.1.0"
description = "Lint and unit-test Sigma detection rules against sample log events - no live SIEM required."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felix Githure", email = "githure.felix95@gmail.com" }]
keywords = ["sigma", "detection", "detection-engineering", "security", "testing", "siem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/manlikefelo/sigmatest"
Repository = "https://github.com/manlikefelo/sigmatest"
Changelog = "https://github.com/manlikefelo/sigmatest/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
sigmatest = "sigmatest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmatest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sigmatest"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
