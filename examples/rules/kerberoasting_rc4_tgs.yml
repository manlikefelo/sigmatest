title: Kerberoasting - RC4 (0x17) TGS Request for an SPN Account
id: 6f9d0a2e-1c4b-4e77-9b0a-2a1e5c7d0011
status: stable
description: |
    Detects a Kerberos service-ticket (TGS) request encrypted with RC4 (0x17).
    Modern service accounts should negotiate AES (0x11/0x12); an RC4 TGS request
    for an account carrying a Service Principal Name is the classic Kerberoasting
    signature, because the RC4-encrypted ticket can be cracked offline against the
    service account's password.
references:
    - https://attack.mitre.org/techniques/T1558/003/
    - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4769
author: Felix Githure
date: 2026-07-31
tags:
    - attack.credential-access
    - attack.t1558.003
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
    filter_machine:
        # Machine/computer accounts legitimately request tickets; their names end in $.
        ServiceName|endswith: '$'
    filter_krbtgt:
        ServiceName: 'krbtgt'
    condition: selection and not 1 of filter_*
falsepositives:
    - Legacy applications or appliances that still negotiate RC4 for service tickets.
    - Older service accounts not yet migrated to AES encryption.
level: high
