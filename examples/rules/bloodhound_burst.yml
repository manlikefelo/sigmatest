title: Directory Enumeration Burst - Possible BloodHound/SharpHound Collection
id: c4e6a8b0-9d1f-4e3a-8b4c-5d4a8f0b0044
status: experimental
description: |
    Detects a high volume of directory object-access reads (Events 4661/4662) from a
    single account in a short window - the pattern produced by BloodHound/SharpHound
    or bloodhound-python enumerating users, groups, ACLs and trusts. Unlike the sharp
    single-event signatures for Kerberoasting/AS-REP/DCSync, enumeration is a *rate*
    signal, so this rule is threshold-based and inherently noisier: it trades
    precision for coverage and needs environment-specific tuning.
references:
    - https://attack.mitre.org/techniques/T1087/002/
    - https://attack.mitre.org/techniques/T1069/002/
author: Felix Githure
date: 2026-07-31
tags:
    - attack.discovery
    - attack.t1087.002
    - attack.t1069.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID:
            - 4661
            - 4662
    timeframe: 60s
    condition: selection | count() by SubjectUserName > 15
falsepositives:
    - Vulnerability scanners, identity-governance tools, or backup/AD-audit agents
      that legitimately read large portions of the directory - whitelist their accounts.
    - Administrators running large ad-hoc queries or reporting tools.
level: medium
